# Varsayılan senaryo ayarları.
# TASLAK: buradaki sayılar başlangıç değeridir. Boyutlandırma EM-1'de,
# istasyon/araç parametreleri YM-2'de; Hafta 2 parametre tablosuyla kesinleşir.
# Birimler: güç kW, enerji kWh, saat ondalık (18.5 = 18:30), SOC 0-1 arası.

simulation:
  step_minutes: 15        # zaman adımı
  horizon_hours: 24       # temsili gün (yıllık simülasyon kararı açık)

site:
  name: Bandirma          # PVGIS konumu (YM-1)
  latitude: 40.352
  longitude: 27.977

station:
  type: site_otoparki     # site_otoparki | avm | otoyol
  power_limit_kw: 150     # bağlantı/trafo kaynaklı istasyon limiti; EMS bunu aşmamalı
  chargers:
    - {kind: AC, count: 8, power_kw: 22}
    - {kind: DC, count: 2, power_kw: 50}   # site otoparkında DC gerekli mi? bkz. docs/kapsam.md

vehicles:
  count: 20
  battery_kwh: 60
  # Site otoparkı: akşam eve dönüş, sabah işe çıkış. Araçlar gece boyu bağlı.
  arrival_hour:   {mean: 18.5, std: 1.5}
  departure_hour: {mean: 7.5,  std: 1.0}
  arrival_soc:    {min: 0.2, max: 0.6}
  target_soc: 0.8

pv:
  installed_kw: 100
  # PVGIS sorgu ayarları (YM-1). Veri 1 kWp için indirilir, installed_kw ile ölçeklenir.
  pvgis_year: 2023        # PVGIS v5.3'te mevcut son yıl
  tilt_deg: 30            # panel eğimi (Bandırma için optimuma yakın)
  azimuth_deg: 0          # PVGIS: 0 = güney
  loss_percent: 14        # kablo, inverter, kirlenme kayıpları (PVGIS varsayılanı)

loads:
  # Sabit yükler (site binaları), saatlik profil (YM-1). Şekil BDEW standart yük profillerinden
  # (H0 konut, G0 ticari) gelir, büyüklük yıllık tüketimle ölçeklenir. Kaynak: docs/veri-kaynaklari.md
  # EM-1 kararı: 50 daire (120 MWh/yıl) + ortak alan/dükkânlar (80 MWh/yıl) = 200 MWh/yıl, araç şarjı hariç.
  year: 2023              # PVGIS yılıyla aynı tutulur ki haftanın günleri ve tatiller eşleşsin
  residential:
    households: 50        # site daire sayısı (EM-1): 50 × 2400 = 120 MWh/yıl
    kwh_per_household: 2400   # daire başına yıllık tüketim (başlangıç varsayımı)
  commercial:
    annual_kwh: 80000     # ortak alanlar (asansör, aydınlatma, hidrofor) + sitedeki küçük dükkânlar

bess:
  capacity_kwh: 200
  power_kw: 100
  efficiency: 0.95
  soc_min: 0.1
  soc_max: 0.9
  soc_initial: 0.5

grid:
  transformer_kva: 400
  voltage_min_pu: 0.95    # KPI: gerilim bunun altına düşüyor mu?
  voltage_max_pu: 1.05
  max_loading_percent: 100

tariff:
  # EPDK üç zamanlı mesken tarifesi, 4 Nisan 2026 dönemi, vergiler hariç (YM-1).
  # Kaynak ve doğrulama durumu: docs/veri-kaynaklari.md
  periods:
    - {name: gunduz, start: 6,  end: 17, price_tl_per_kwh: 4.38}
    - {name: puant,  start: 17, end: 22, price_tl_per_kwh: 6.17}
    - {name: gece,   start: 22, end: 6,  price_tl_per_kwh: 2.94}
