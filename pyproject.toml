[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid"
version = "0.1.0"
description = "EV şarj istasyonu içeren mikro-şebeke simülasyonu"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PuLP 3.x her değişken için "PuLP 4'te kaldırılacak" uyarısı basıyor (bir test koşusunda 300 binden fazla);
# gerçek uyarılar arada kayboluyordu. Sürüm requirements.txt'te <4'e sabit.
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]
